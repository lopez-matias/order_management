{% extends "base.html" %}
{% block content %}
<section class="page-heading compact"><div><p class="eyebrow">OPERACIÓN COMERCIAL</p><h1>Pedidos</h1><p>Consulta el historial y el estado de cada operación.</p></div><a href="/pedidos/nuevo" class="btn btn-primary"><svg><use href="#icon-plus"></use></svg>Nuevo pedido</a></section>
<section class="card list-card"><div class="toolbar toolbar-wrap"><label class="search-field"><svg><use href="#icon-search"></use></svg><input id="order-search" type="search" placeholder="Buscar por número o cliente…"></label><label class="select-field"><select id="order-status"><option value="">Todos los estados</option><option value="draft">Borrador</option><option value="confirmed">Confirmado</option><option value="completed">Completado</option><option value="cancelled">Cancelado</option></select></label><label class="select-field"><select id="payment-status"><option value="">Todos los pagos</option><option value="pending">Pendiente</option><option value="partial">Parcial</option><option value="paid">Pagado</option><option value="overdue">Vencido</option></select></label><label class="date-filter"><span>Desde</span><input id="date-from" type="date"></label><label class="date-filter"><span>Hasta</span><input id="date-to" type="date"></label></div><div class="table-scroll"><table><thead><tr><th>PEDIDO</th><th>CLIENTE</th><th>FECHA</th><th>ESTADO</th><th>PAGO</th><th class="align-right">TOTAL</th><th></th></tr></thead><tbody id="orders-table"></tbody></table></div><div class="pagination" id="orders-pagination"></div></section>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', path='/js/orders.js') }}"></script>{% endblock %}
